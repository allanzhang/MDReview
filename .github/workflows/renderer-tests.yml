name: Renderer Tests

on:
  push:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Docs/renderer-contract.md'
      - 'project.yml'
      - 'MDReview.xcodeproj/**'
      - '.github/workflows/renderer-tests.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Docs/renderer-contract.md'
      - 'project.yml'
      - 'MDReview.xcodeproj/**'
      - '.github/workflows/renderer-tests.yml'
  workflow_dispatch:

jobs:
  renderer:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run renderer tests
        run: node Tests/run.js

      - name: Build app
        run: >-
          xcodebuild
          -project MDReview.xcodeproj
          -scheme MDReview
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/MDReviewDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
